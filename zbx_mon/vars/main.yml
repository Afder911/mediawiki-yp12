---
# ===================================================
# vars file for zbx_mon
# ===================================================
zabbix_version: "7.4"
zabbix_repo_package: "zabbix-release_latest_7.4+ubuntu24.04_all.deb"

zabbix_db_name: zabbix
zabbix_db_user: zabbix
zabbix_db_password: 12345

zabbix_server_name: "Zabbix"
zabbix_frontend_port: 80
zabbix_timezone: "Europe/Moscow"

zabbix_php_fpm_service: php8.3-fpm

zabbix_api_user: "Admin"
zabbix_api_password: "zabbix"

zabbix_frontend_root: /usr/share/zabbix/ui
zabbix_nginx_site_path: /etc/nginx/sites-available/zabbix.conf
zabbix_php_config_path: /etc/zabbix/web/zabbix.conf.php
zabbix_api_url: "http://127.0.0.1/api_jsonrpc.php"

zabbix_host_group: "Infrastructure"

zabbix_hosts:
  - host_name: "pg-master"
    visible_name: "DB Master"
    ip: "{{ hostvars['pg-master'].ansible_host }}"
    groups:
      - "Infrastructure"

  - host_name: "pg-replica"
    visible_name: "DB Replica"
    ip: "{{ hostvars['pg-replica'].ansible_host }}"
    groups:
      - "Infrastructure"

  - host_name: "mediawiki-01"
    visible_name: "MediaWiki App 1"
    ip: "{{ hostvars['mediawiki-01'].ansible_host }}"
    groups:
      - "Infrastructure"

  - host_name: "mediawiki-02"
    visible_name: "MediaWiki App 2"
    ip: "{{ hostvars['mediawiki-02'].ansible_host }}"
    groups:
      - "Infrastructure"

  - host_name: "nginx-lb"
    visible_name: "Nginx Load Balancer"
    ip: "{{ hostvars['nginx-lb'].ansible_host }}"
    groups:
      - "Infrastructure"

  - host_name: "ans-bkp"
    visible_name: "Backup Server"
    ip: "{{ hostvars['ans-bkp'].real_ip }}"
    groups:
      - "Infrastructure"

  - host_name: "zabbix-mon"
    visible_name: "Zabbix Monitoring Server"
    ip: "{{ hostvars['zabbix-mon'].ansible_host }}"
    groups:
      - "Infrastructure"

zabbix_http_targets:
  - host_name: "nginx-lb"
    scenario_name: "HTTP nginx-lb"
    url: "http://{{ hostvars['nginx-lb'].ansible_host }}"
    status_codes:
      - 200

  - host_name: "mediawiki-01"
    scenario_name: "HTTP mediawiki-1"
    url: "http://{{ hostvars['mediawiki-01'].ansible_host }}"
    status_codes:
      - 200
      - 301
      - 302

  - host_name: "mediawiki-02"
    scenario_name: "HTTP mediawiki-2"
    url: "http://{{ hostvars['mediawiki-02'].ansible_host }}"
    status_codes:
      - 200
      - 301
      - 302

zabbix_db_tcp_targets:
  - host_name: "pg-master"
    item_name: "PostgreSQL TCP 5432"
    item_key: "net.tcp.service[tcp,{{ hostvars['pg-master'].ansible_host }},5432]"

  - host_name: "pg-replica"
    item_name: "PostgreSQL TCP 5432"
    item_key: "net.tcp.service[tcp,{{ hostvars['pg-replica'].ansible_host }},5432]"

packages_for_zabbix_base:
  - nginx
  - php-fpm
  - php-pgsql
  - php-mbstring
  - php-gd
  - php-xml
  - php-bcmath
  - php-ldap
  - php-curl
  - php-zip
  - php-intl
  - postgresql
  - acl
  - python3-psycopg2
  - python3-requests
  - wget

packages_for_zabbix_server:
  - zabbix-server-pgsql
  - zabbix-frontend-php
  - zabbix-sql-scripts
  - zabbix-agent

