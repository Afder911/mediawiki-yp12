---
# tasks file for nginx_lb
- name: install packages for nginx load balancer
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ packages_for_nginx_lb }}"

- name: ensure nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: wait for mediawiki_01 http
  ansible.builtin.wait_for:
    host: "{{ hostvars['mediawiki-01'].ansible_host }}"
    port: 80
    timeout: 30

- name: wait for mediawiki_02 http
  ansible.builtin.wait_for:
    host: "{{ hostvars['mediawiki-02'].ansible_host }}"
    port: 80
    timeout: 30

- name: deploy nginx load balancer configuration
  ansible.builtin.template:
    src: mediawiki-lb.conf.j2
    dest: /etc/nginx/sites-available/mediawiki_lb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: enable nginx load balancer site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/mediawiki_lb.conf"
    dest: "/etc/nginx/sites-enabled/mediawiki_lb.conf"
    state: link
    force: true
  notify: Restart nginx

- name: remove default nginx site
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/default"
    state: absent
  notify: Restart nginx

- name: wait for load balancer http
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "80"
    timeout: 30

- name: check load balancer main page over http
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
    method: GET
    status_code: 200
    return_content: true
  register: nginx_lb_http_check

- name: assert load balancer response
  ansible.builtin.assert:
    that:
      - nginx_lb_http_check.status == 200
      - "'MediaWiki' in nginx_lb_http_check.content"
    fail_msg: "Nginx load balancer HTTP check failed"
    success_msg: "Nginx load balancer is reachable"
