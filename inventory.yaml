---
linux:  # Группа хостов
  children:  # Обозначение, что будет подгруппа хостов
# ===================================================
# Мониторинг Ansible + backup
# ===================================================
    ans_bkp_group:
      hosts:
        ans-bkp:
          ansible_host: localhost
          ansible_connection: local
          real_ip: 192.168.0.100

# ===================================================
# Мониторинг Zabbix
# ===================================================
    zabbix_group:
      hosts:
        zabbix-mon:
          ansible_host: 192.168.0.90

# ===================================================
# PostgreSQL (master)
# ===================================================
    pg_master_group:
      hosts:
        pg-master:
          ansible_host: 192.168.0.50

# ===================================================
# PostgreSQL (replica)
# ===================================================
    pg_replica_group:
      hosts:
        pg-replica:
          ansible_host: 192.168.0.52

# ===================================================
# Узел MediaWiki 1
# ===================================================
    mediawiki_01_group:
      hosts:
        mediawiki-01:
          ansible_host: 192.168.0.20

# ===================================================
# Узел MediaWiki 2
# ===================================================
    mediawiki_02_group:
      hosts:
        mediawiki-02:
          ansible_host: 192.168.0.22

# ===================================================
# Балансировщик Nginx
# ===================================================
    nginx_group:
      hosts:
        nginx-lb:
          ansible_host: 192.168.0.10
          public_ip: 158.160.8.48 # Статический ip для выхода в интернет

# ===================================================
# Переменные подгруппы children
# ===================================================
  vars:
    ansible_user: "filippmolokov"
    connection_protocol: ssh  # тип подключения
    ansible_become: yes  # Становиться ли другим пользователем после подключения
    become: true
    become_method: sudo

