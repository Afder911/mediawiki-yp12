---
# ===================================================
# tasks file for mediawiki_01
# ===================================================
- name: install nginx and php packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ packages_for_mediawiki_01 }}"

- name: ensure nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: ensure php-fpm is started
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true

- name: wait for postgresql on master
  ansible.builtin.wait_for:
    host: "{{ mediawiki_db_host }}"
    port: "{{ mediawiki_db_port }}"
    timeout: 30

- name: download mediawiki archive
  ansible.builtin.get_url:
    url: "{{ mediawiki_download_url }}"
    dest: "{{ mediawiki_archive_path }}"
    mode: "0644"

- name: extract mediawiki release
  ansible.builtin.unarchive:
    src: "{{ mediawiki_archive_path }}"
    dest: "{{ mediawiki_extract_parent }}"
    remote_src: true
    creates: "{{ mediawiki_release_dir }}"

- name: create symlink to mediawiki install dir
  ansible.builtin.file:
    src: "{{ mediawiki_release_dir }}"
    dest: "{{ mediawiki_install_dir }}"
    state: link
    force: true

- name: set ownership on mediawiki files
  ansible.builtin.file:
    path: "{{ mediawiki_release_dir }}"
    owner: "{{ mediawiki_owner }}"
    group: "{{ mediawiki_group }}"
    recurse: true

- name: deploy nginx config for mediawiki
  ansible.builtin.template:
    src: mediawiki.nginx.conf.j2
    dest: "/etc/nginx/sites-available/mediawiki.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: enable mediawiki nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/mediawiki.conf"
    dest: "/etc/nginx/sites-enabled/mediawiki.conf"
    state: link
    force: true
  notify: Restart nginx

- name: remove default nginx site
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/default"
    state: absent
  notify: Restart nginx

- name: check if mediawiki already installed
  ansible.builtin.stat:
    path: "{{ mediawiki_install_dir }}/LocalSettings.php"
  register: mediawiki_localsettings

- name: run mediawiki console installer
  ansible.builtin.command: >
    php maintenance/install.php
    --dbtype "{{ mediawiki_db_type }}"
    --dbserver "{{ mediawiki_db_host }}"
    --dbport "{{ mediawiki_db_port }}"
    --dbname "{{ mediawiki_db_name }}"
    --dbuser "{{ mediawiki_db_user }}"
    --dbpass "{{ mediawiki_db_password}}"
    --scriptpath ""
    --server "{{ mediawiki_server_url }}"
    --lang "{{ mediawiki_language }}"
    --pass "{{ mediawiki_admin_password }}"
    "{{ mediawiki_site_name }}"
    "{{ mediawiki_admin_user }}"
  args:
    chdir: "{{ mediawiki_install_dir }}"
  when:
    - not mediawiki_localsettings.stat.exists
    - mediawiki_run_installer | bool
  register: mediawiki_install_result
  changed_when: not mediawiki_localsettings.stat.exists

- name: set strict permissions on LocalSettings.php
  ansible.builtin.file:
    path: "{{ mediawiki_install_dir }}/LocalSettings.php"
    owner: "{{ mediawiki_owner }}"
    group: "{{ mediawiki_group }}"
    mode: "0600"
  when: mediawiki_localsettings.stat.exists or (mediawiki_install_result is changed)

- name: wait for http on mediawiki host
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 80
    timeout: 30

- name: check that LocalSettings.php exists
  ansible.builtin.stat:
    path: "{{ mediawiki_install_dir }}/LocalSettings.php"
  register: final_localsettings

- name: fail if LocalSettings.php was not created
  ansible.builtin.fail:
    msg: "MediaWiki installation failed: LocalSettings.php not found"
  when:
    - mediawiki_run_installer | bool
    - not final_localsettings.stat.exists

- name: check mediawiki main page over http
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
    method: GET
    status_code: [200, 301, 302]
    return_content: false
    follow_redirects: none
  register: mediawiki_http_check
  when: final_localsettings.stat.exists

- name: check that response contains mediawiki
  ansible.builtin.assert:
    that:
      - mediawiki_http_check.status in [200, 301, 302]
    fail_msg: "MediaWiki HTTP Check failed"
    success_msg: "MediaWiki is installed and reachable"
  when: final_localsettings.stat.exists
