---
# ===================================================
# vars file for mediawiki_02
# ===================================================
mediawiki_server_name: mediawiki-2

mediawiki_primary_app_host: "{{ hostvars['mediawiki-01'].ansible_host }}"

mediawiki_archive_path: /tmp/mediawiki.tar.gz
mediawiki_extract_parent: /var/www
mediawiki_release_dir: "/var/www/mediawiki-1.42.1"
mediawiki_localsettings_path: "{{ mediawiki_install_dir }}/LocalSettings.php"

php_fpm_service: php8.3-fpm
php_fpm_socket: /run/php/php8.3-fpm.sock

packages_for_mediawiki_02:
  - nginx
  - php
  - php-fpm
  - php-intl
  - php-mbstring
  - php-xml
  - php-apcu
  - php-curl
  - php-pgsql
  - php-cli
  - php-zip
  - php-gd
